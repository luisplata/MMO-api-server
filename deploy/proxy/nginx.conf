# P9 — WSS through a TLS-terminating reverse proxy.
#
# TLS and certificates live here, never in the Go game server. The
# upstream is a private address that must not be published; browsers only
# reach it through this listener. Plain ws:// from the internet is
# rejected because only the TLS server block exists.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # The Upgrade/Connection pair is what turns an HTTP request into a
    # WebSocket. Omitting it makes the Go handler answer 426.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream mmo_game {
        # Private upstream: the Go server's -wss address (no TLS).
        server 10.0.0.10:8080;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        server_name game.example.com;

        ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /ws {
            proxy_pass http://mmo_game;
            proxy_http_version 1.1;

            # Forward the upgrade and preserve what the Go server checks.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # The client pings ~5/s; 30 s idle is well above that gap.
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # One envelope per frame: no buffering, no caching.
            proxy_buffering off;
            proxy_cache off;
            client_max_body_size 64k;
        }
    }
}
