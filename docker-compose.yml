# MMO API Server — docker-compose.
#
# REPLICATION NOTE (v1):
#   World state is IN-MEMORY inside one process — every replica is an
#   INDEPENDENT world. There is no shared/sharded state yet; true
#   coordinated multi-replica state is future work.
#   `docker compose up --scale mmo-server=N` is for TESTING THE PROTOCOL
#   against N independent servers, NOT for a shared world. Replicas share
#   no host bind at all: the game server is never published, only the
#   TLS proxy is public.
#
# CONFIG NOTE:
#   cmd/server reads configuration from CLI FLAGS ONLY (no env vars), so
#   the flags are set explicitly in `command:` below. `-dev-auth true` =
#   v1 dev mode: any credentials are accepted and the username becomes
#   the player id (real auth is future work). TLS terminates at the
#   reverse proxy; this service speaks plain ws:// on the private network.

services:
  mmo-server:
    build:
      context: .
      dockerfile: Dockerfile
    # Private upstream: reachable by the proxy container on the compose
    # network only. Publishing it would bypass TLS and the Origin
    # allowlist, so this service exposes but never publishes a port.
    expose:
      - "8080"
    restart: unless-stopped
    command:
      - -wss
      - :8080
      - -dev-auth
      - "true"
    healthcheck:
      # Bare TCP connect probe on the WSS port (busybox nc in the alpine
      # runtime; `-z` = connect with zero I/O). The probe closes
      # immediately, so no session is left behind — the per-conn goroutine
      # exits on EOF. If a future base image lacks the nc applet, swap to:
      # ["CMD", "wget", "-q", "-O", "/dev/null", "tcp://127.0.0.1:8080"]
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
