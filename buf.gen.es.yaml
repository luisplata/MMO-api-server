# TypeScript (ES) codegen template — protobuf-es v2.16.0.
#
# The generated output under proto/v1/gen/es is COMMITTED, so browser
# consumers never need buf, protoc, or Node. Regenerate with:
#   npm ci && make proto-es
#
# This template emits the COMPLETE public world contract: every message in
# proto/v1/world.proto, unfiltered. Do not hand-edit the generated output.
version: v2
plugins:
  - local: protoc-gen-es
    out: proto/v1/gen/es
    opt: target=ts
